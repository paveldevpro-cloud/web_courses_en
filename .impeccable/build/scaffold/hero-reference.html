<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-keynote.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1360px">
  <div class="r-title region text" data-region="title"><!-- Centered display title Build a local RAG system --><p style="line-height:1.05;margin:0">title</p></div>
  <div class="r-stack region text" data-region="stack"><!-- Blue stack line LangChain LangGraph Chroma Ollama --><p style="line-height:1.05;margin:0">stack</p></div>
  <div class="r-lead region text" data-region="lead"><!-- Mute supporting sentence about spoken-video script --><p style="line-height:1.05;margin:0">lead</p></div>
  <div class="r-cta region control" data-region="cta"><!-- Primary pill CTA Start with LLM Agent: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta); a control need not have button chrome --></div>
  <div class="r-path region control" data-region="path"><!-- Secondary module path Streams CLI FastAPI SSE: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop path); a control need not have button chrome --></div>
</main>
</body>
</html>
