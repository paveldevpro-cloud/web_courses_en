<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1440px;
        height: 900px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        display: grid;
        grid-template-rows: 1fr 72px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 120px;
        background: #fff;
      }
      .stage h1 {
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.03em;
        max-width: 12ch;
        line-height: 1.05;
      }
      .stage p {
        margin-top: 20px;
        font-size: 21px;
        color: #6e6e73;
        max-width: 38ch;
      }
      .cta {
        margin-top: 32px;
        width: fit-content;
        background: #0066cc;
        color: #fff;
        padding: 12px 24px;
        border-radius: 980px;
        font-size: 17px;
      }
      .rail {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 0 24px;
        border-top: 1px solid #d2d2d7;
        background: #fff;
        color: #6e6e73;
        font-size: 14px;
      }
      .rail .on {
        color: #0066cc;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>From empty terminal to streaming API</h1>
      <p>
        Scroll through pinned chapters — Agent, Streams, CLI, FastAPI, SSE —
        each with its own Start.
      </p>
      <div class="cta">Enter chapter 1</div>
    </div>
    <div class="rail">
      <span class="on">Agent</span><span>Streams</span><span>CLI</span
      ><span>FastAPI</span><span>SSE</span>
    </div>
  </body>
</html>
