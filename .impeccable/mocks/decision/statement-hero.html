<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1440px;
        height: 900px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #1d1d1f;
        padding: 96px 120px;
      }
      h1 {
        font-size: 80px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
        max-width: 11ch;
      }
      .rule {
        margin: 40px 0;
        height: 1px;
        background: #d2d2d7;
        max-width: 720px;
      }
      .row {
        display: flex;
        gap: 48px;
        align-items: baseline;
      }
      .start {
        color: #0066cc;
        font-size: 21px;
        font-weight: 500;
      }
      .mods {
        color: #6e6e73;
        font-size: 17px;
        display: flex;
        gap: 24px;
      }
    </style>
  </head>
  <body>
    <h1>From terminal RAG to streaming API.</h1>
    <div class="rule"></div>
    <div class="row">
      <span class="start">Start lesson</span>
      <div class="mods">
        <span>Basics</span><span>Agent</span><span>Streams</span
        ><span>CLI</span><span>FastAPI</span><span>SSE</span>
      </div>
    </div>
  </body>
</html>
